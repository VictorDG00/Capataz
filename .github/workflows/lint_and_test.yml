name: 🛡️ Capataz Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Linter & Style (Ruff)
        run: ruff check .

      - name: 🛡️ Auditoria de Segurança (Bandit)
        run: bandit -r src/

      - name: 🧪 Executar Testes Unitários (Pytest)
        run: pytest tests/

      - name: 🚨 Verificação de Vulnerabilidades (Safety)
        run: safety check
